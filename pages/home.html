<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Until I'm back</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🫧</text></svg>">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/home.css">
  <script src="/vendor/d3/d3.min.js"></script>
  <script src="/vendor/leaflet/leaflet.js"></script>
</head>
<body class="home">
  <div class="progress" aria-hidden="true"><div class="progress-bar" id="progress"></div></div>
  <header class="top">
    <h1 id="title">Until I'm back</h1>
    <nav class="tabs" id="tabs" aria-label="Views"></nav>
    <div class="count"><b id="count">0</b> <span id="count-label">people</span></div>
  </header>

  <main class="stage" id="stage">
    <section class="view view-graph" id="view-graph" data-view="graph" aria-label="Connections"></section>
    <section class="view view-map" id="view-map" data-view="map" aria-label="Map"></section>
    <section class="view view-needs" id="view-needs" data-view="needs" aria-label="Needs"></section>
    <section class="view view-bringing" id="view-bringing" data-view="bringing" aria-label="Bringing"></section>
    <section class="view view-splash" id="view-splash" data-view="splash">
      <div class="splash-inner">
        <h2>Your card</h2>
        <img class="splash-qr" src="/api/qr.svg" alt="QR code to the night page">
        <p>Scan &rarr; <span class="hi-url"></span></p>
      </div>
    </section>
  </main>

  <aside class="qr-corner" id="qr-corner">
    <img src="/api/qr.svg" alt="QR code to the invite" id="qr-img">
    <div class="qr-caption"><b>Scan</b><span class="hi-url"></span></div>
  </aside>

  <div class="paused-badge" id="paused" hidden>⏸ Paused</div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script type="module" src="/js/home.js"></script>
</body>
</html>
