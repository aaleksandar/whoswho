# Fly.io. Change `app` if the name is taken, then:
#   fly volumes create whoswho_data --region lhr --size 1
#   fly secrets set ADMIN_PASSWORD=... INVITE_CODE=... PUBLIC_BASE_URL=https://<app>.fly.dev PLAYLIST_URL=...
#   fly deploy

app = "whoswho-sendoff"
primary_region = "lhr"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  DB_PATH = "/data/whoswho.sqlite"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    path = "/api/event"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[mounts]]
  source = "whoswho_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
